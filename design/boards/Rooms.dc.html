<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chill — All devices</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:disabled{cursor:default}
.th-light{--bg:#E7E5E2;--ink:#141210;--muted:#5E5A56;--track:rgba(20,18,16,.07);--glass:rgba(255,255,255,.58);--glass-line:rgba(255,255,255,.85);--glass-shadow:0 10px 30px rgba(60,40,20,.07);--pill:#FFFFFF;--sel-bg:#141210;--sel-ink:#FFFFFF;--accent:#E8701F;--unit:#F7F6F4;--slot:#1C1A18;--particle:rgba(20,18,16,.5);color-scheme:light}
.th-dark{--bg:#151413;--ink:#F3F1EE;--muted:#A39E98;--track:rgba(255,255,255,.08);--glass:rgba(48,46,44,.55);--glass-line:rgba(255,255,255,.08);--glass-shadow:0 10px 30px rgba(0,0,0,.3);--pill:rgba(255,255,255,.10);--sel-bg:#F3F1EE;--sel-ink:#151413;--accent:#F07A2A;--unit:#F2F1EF;--slot:#1C1A18;--particle:rgba(255,255,255,.55);color-scheme:dark}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow)}
.th-light{--wave:rgba(20,18,16,.09)}
.th-dark{--wave:rgba(255,255,255,.07)}
.breeze{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.breeze svg{position:absolute;left:0;top:0}
.breeze path{fill:none;stroke:var(--wave);stroke-width:1}
.bz1{animation:breeze 70s linear infinite}
.bz2{animation:breeze 110s linear infinite}
@keyframes breeze{to{transform:translateX(-390px)}}
@media (prefers-reduced-motion:reduce){.bz1,.bz2{animation:none}}
.press{transition:transform .15s}
.press:active{transform:scale(.94)}
.card{transition:opacity .3s}
.card.offline{opacity:.55}
.drip{position:absolute;top:0;width:3px;height:3px;border-radius:50%;background:var(--particle);opacity:0;animation:drip 1.6s linear infinite}
@keyframes drip{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(18px);opacity:0}}
.is-off .drip{animation:none;opacity:0}
.slot{height:4px;transition:height .4s}
.is-off .slot{height:2px}
.led{background:var(--accent);box-shadow:0 0 5px var(--accent);transition:background .3s,box-shadow .3s}
.is-off .led{background:#C9C5C0;box-shadow:none}
.pw{background:var(--pill);color:var(--ink);transition:background .3s,color .3s,box-shadow .3s,transform .15s}
.pw:active{transform:scale(.92)}
.pw.on{background:var(--accent);color:#FFFFFF;box-shadow:0 6px 16px rgba(232,112,31,.35)}
.pw:disabled{opacity:.4}
.primary{background:var(--sel-bg);color:var(--sel-ink);transition:opacity .3s,transform .15s}
.primary:active{transform:scale(.97)}
.primary:disabled{opacity:.35}
.nav{color:var(--muted)}
.nav.cur{background:var(--sel-bg);color:var(--sel-ink)}
@media (prefers-reduced-motion:reduce){.drip{animation:none}}
</style>
</helmet>
<div class="th-{{theme}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
<div class="breeze" aria-hidden="true">
  <svg class="bz1" width="780" height="844" viewBox="0 0 780 844"><path d="M0 52 Q48.75 43 97.5 52 T195 52 T292.5 52 T390 52 T487.5 52 T585 52 T682.5 52 T780 52"></path><path d="M0 200 Q48.75 188 97.5 200 T195 200 T292.5 200 T390 200 T487.5 200 T585 200 T682.5 200 T780 200"></path><path d="M0 348 Q48.75 358 97.5 348 T195 348 T292.5 348 T390 348 T487.5 348 T585 348 T682.5 348 T780 348"></path><path d="M0 496 Q48.75 485 97.5 496 T195 496 T292.5 496 T390 496 T487.5 496 T585 496 T682.5 496 T780 496"></path><path d="M0 644 Q48.75 638 97.5 644 T195 644 T292.5 644 T390 644 T487.5 644 T585 644 T682.5 644 T780 644"></path><path d="M0 792 Q48.75 801 97.5 792 T195 792 T292.5 792 T390 792 T487.5 792 T585 792 T682.5 792 T780 792"></path></svg>
  <svg class="bz2" width="780" height="844" viewBox="0 0 780 844"><path d="M0 126 Q32.5 132 65 126 T130 126 T195 126 T260 126 T325 126 T390 126 T455 126 T520 126 T585 126 T650 126 T715 126 T780 126"></path><path d="M0 274 Q32.5 267 65 274 T130 274 T195 274 T260 274 T325 274 T390 274 T455 274 T520 274 T585 274 T650 274 T715 274 T780 274"></path><path d="M0 422 Q32.5 417 65 422 T130 422 T195 422 T260 422 T325 422 T390 422 T455 422 T520 422 T585 422 T650 422 T715 422 T780 422"></path><path d="M0 570 Q32.5 578 65 570 T130 570 T195 570 T260 570 T325 570 T390 570 T455 570 T520 570 T585 570 T650 570 T715 570 T780 570"></path><path d="M0 718 Q32.5 706 65 718 T130 718 T195 718 T260 718 T325 718 T390 718 T455 718 T520 718 T585 718 T650 718 T715 718 T780 718"></path></svg>
</div>
  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 20px 20px 28px; display: flex; flex-direction: column">

    <header style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 14px; color: var(--muted)">{{summary}}</span>
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15">All devices</h1>
    </header>

    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 24px">
      <sc-for list="{{rooms}}" as="r" hint-placeholder-count="3">
        <div class="glass card {{r.cardCls}}" style="display: flex; align-items: center; gap: 14px; padding: 14px 14px 14px 14px; border-radius: 28px">
          <span aria-hidden="true" style="position: relative; width: 68px; height: 68px; border-radius: 22px; background: var(--pill); flex: none">
            <span style="position: absolute; left: 12px; top: 20px; width: 44px; height: 15px; border-radius: 6px 6px 8px 8px; background: var(--unit); box-shadow: inset 0 1px 0 #FFFFFF, 0 6px 12px rgba(60,40,20,0.16)">
              <span class="slot" style="position: absolute; left: 6px; right: 6px; bottom: 3px; border-radius: 2px; background: var(--slot)"></span>
              <span class="led" style="position: absolute; right: 6px; top: 4px; width: 3px; height: 3px; border-radius: 2px"></span>
            </span>
            <span style="position: absolute; left: 12px; top: 38px; width: 44px; height: 22px">
              <span class="drip" style="left: 10px; animation-delay: -0.2s"></span>
              <span class="drip" style="left: 21px; animation-delay: -0.9s"></span>
              <span class="drip" style="left: 32px; animation-delay: -0.5s"></span>
            </span>
          </span>
          <a href="Main.dc.html" style="display: flex; flex-direction: column; gap: 3px; flex: 1 1 auto; min-width: 0; min-height: 48px; justify-content: center">
            <span style="font-size: 16px; font-weight: 600">{{r.name}}</span>
            <span style="font-size: 13px; color: var(--muted); white-space: nowrap">{{r.sub}}</span>
          </a>
          <button class="pw {{r.pwCls}}" onClick="{{r.toggle}}" disabled="{{r.disabled}}" aria-pressed="{{r.on}}" aria-label="{{r.aria}}" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v10"></path><path d="M18.4 6.6a9 9 0 1 1-12.77.04"></path></svg></button>
        </div>
      </sc-for>
    </div>

    <button class="primary" onClick="{{allOff}}" disabled="{{noneOn}}" style="margin-top: auto; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v10"></path><path d="M18.4 6.6a9 9 0 1 1-12.77.04"></path></svg>Turn everything off</button>

    <nav class="glass" aria-label="Main" style="margin-top: 16px; align-self: center; display: flex; gap: 6px; padding: 6px; border-radius: 34px">
      <a href="Main.dc.html" class="nav press" aria-label="Home" style="width: 56px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg></a>
      <a href="Rooms.dc.html" class="nav cur press" aria-label="All devices" aria-current="page" style="width: 56px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect></svg></a>
      <a href="Schedules.dc.html" class="nav press" aria-label="Schedules" style="width: 56px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></a>
      <button class="nav press" aria-label="Settings" style="width: 56px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const power = s.power ?? { bed: true, living: true, study: false };
    const base = [
      { id: 'bed', name: 'Bedroom', verb: 'Cooling', set: 24, inside: 27, online: true },
      { id: 'living', name: 'Living room', verb: 'Drying', set: 25, inside: 29, online: true },
      { id: 'study', name: 'Study', verb: 'Cooling', set: 24, inside: 31, online: false }
    ];
    const rooms = base.map((r) => {
      const on = r.online && !!power[r.id];
      return {
        name: r.name,
        sub: !r.online ? 'Offline' : (on ? r.verb + ' to ' + r.set + '°' : 'Standby · Inside ' + r.inside + '°'),
        on: on,
        pwCls: on ? 'on' : '',
        cardCls: (r.online ? '' : 'offline ') + (on ? '' : 'is-off'),
        disabled: !r.online,
        aria: r.name + ' power',
        toggle: () => this.setState({ power: Object.assign({}, power, { [r.id]: !power[r.id] }) })
      };
    });
    const onCount = rooms.filter((r) => r.on).length;
    return {
      theme: this.props.theme ?? 'dark',
      rooms: rooms,
      summary: base.length + ' air conditioners · ' + onCount + ' on',
      noneOn: onCount === 0,
      allOff: () => this.setState({ power: { bed: false, living: false, study: false } })
    };
  }
}
</script>
</body>
</html>
