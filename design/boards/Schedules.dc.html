<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chill — Schedules</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.th-light{--bg:#E7E5E2;--ink:#141210;--muted:#5E5A56;--track:rgba(20,18,16,.07);--glass:rgba(255,255,255,.58);--glass-line:rgba(255,255,255,.85);--glass-shadow:0 10px 30px rgba(60,40,20,.07);--pill:#FFFFFF;--sel-bg:#141210;--sel-ink:#FFFFFF;--accent:#E8701F;color-scheme:light}
.th-dark{--bg:#151413;--ink:#F3F1EE;--muted:#A39E98;--track:rgba(255,255,255,.08);--glass:rgba(48,46,44,.55);--glass-line:rgba(255,255,255,.08);--glass-shadow:0 10px 30px rgba(0,0,0,.3);--pill:rgba(255,255,255,.10);--sel-bg:#F3F1EE;--sel-ink:#151413;--accent:#F07A2A;color-scheme:dark}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow)}
.th-light{--wave:rgba(20,18,16,.09)}
.th-dark{--wave:rgba(255,255,255,.07)}
.breeze{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.breeze svg{position:absolute;left:0;top:0}
.breeze path{fill:none;stroke:var(--wave);stroke-width:1}
.bz1{animation:breeze 70s linear infinite}
.bz2{animation:breeze 110s linear infinite}
@keyframes breeze{to{transform:translateX(-390px)}}
@media (prefers-reduced-motion:reduce){.bz1,.bz2{animation:none}}
.press{transition:transform .15s}
.press:active{transform:scale(.94)}
.ind{background:var(--sel-bg);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.opt{position:relative;color:var(--muted);transition:color .3s}
.opt.sel{color:var(--sel-ink)}
.sched{transition:opacity .3s}
.sched.off{opacity:.6}
.tg{background:var(--track);transition:background .3s}
.tg .k{left:3px;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .35s cubic-bezier(.3,1.3,.5,1),background .3s}
.tg.on{background:var(--sel-bg)}
.tg.on .k{left:23px}
.th-dark .tg.on .k{background:#151413}
.day{background:var(--track);color:var(--muted)}
.day.d-on{background:var(--sel-bg);color:var(--sel-ink)}
.moon{transition:color .3s}
.moon.set{color:var(--accent)}
.nav{color:var(--muted)}
.nav.cur{background:var(--sel-bg);color:var(--sel-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div class="th-{{theme}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
<div class="breeze" aria-hidden="true">
  <svg class="bz1" width="780" height="844" viewBox="0 0 780 844"><path d="M0 52 Q48.75 43 97.5 52 T195 52 T292.5 52 T390 52 T487.5 52 T585 52 T682.5 52 T780 52"></path><path d="M0 200 Q48.75 188 97.5 200 T195 200 T292.5 200 T390 200 T487.5 200 T585 200 T682.5 200 T780 200"></path><path d="M0 348 Q48.75 358 97.5 348 T195 348 T292.5 348 T390 348 T487.5 348 T585 348 T682.5 348 T780 348"></path><path d="M0 496 Q48.75 485 97.5 496 T195 496 T292.5 496 T390 496 T487.5 496 T585 496 T682.5 496 T780 496"></path><path d="M0 644 Q48.75 638 97.5 644 T195 644 T292.5 644 T390 644 T487.5 644 T585 644 T682.5 644 T780 644"></path><path d="M0 792 Q48.75 801 97.5 792 T195 792 T292.5 792 T390 792 T487.5 792 T585 792 T682.5 792 T780 792"></path></svg>
  <svg class="bz2" width="780" height="844" viewBox="0 0 780 844"><path d="M0 126 Q32.5 132 65 126 T130 126 T195 126 T260 126 T325 126 T390 126 T455 126 T520 126 T585 126 T650 126 T715 126 T780 126"></path><path d="M0 274 Q32.5 267 65 274 T130 274 T195 274 T260 274 T325 274 T390 274 T455 274 T520 274 T585 274 T650 274 T715 274 T780 274"></path><path d="M0 422 Q32.5 417 65 422 T130 422 T195 422 T260 422 T325 422 T390 422 T455 422 T520 422 T585 422 T650 422 T715 422 T780 422"></path><path d="M0 570 Q32.5 578 65 570 T130 570 T195 570 T260 570 T325 570 T390 570 T455 570 T520 570 T585 570 T650 570 T715 570 T780 570"></path><path d="M0 718 Q32.5 706 65 718 T130 718 T195 718 T260 718 T325 718 T390 718 T455 718 T520 718 T585 718 T650 718 T715 718 T780 718"></path></svg>
</div>
  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 20px 20px 28px; display: flex; flex-direction: column">

    <header style="display: flex; align-items: flex-start; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px; color: var(--muted)">Bedroom</span>
        <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15">Schedules</h1>
      </div>
      <button class="glass press" aria-label="New schedule" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
    </header>

    <section class="glass" aria-label="Sleep timer" style="margin-top: 24px; border-radius: 28px; padding: 16px">
      <div style="display: flex; align-items: center; justify-content: space-between; height: 40px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 600">Sleep timer</span>
          <span aria-live="polite" style="font-size: 13px; color: var(--muted)">{{timerNote}}</span>
        </div>
        <span class="moon {{moonCls}}" aria-hidden="true" style="width: 40px; height: 40px; border-radius: 20px; background: var(--pill); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></span>
      </div>
      <div role="group" aria-label="Turn off after" style="position: relative; margin-top: 12px; padding: 4px; border-radius: 26px; background: var(--track)">
        <div class="ind" aria-hidden="true" style="position: absolute; left: 4px; top: 4px; width: 58.8px; height: 44px; border-radius: 22px; transform: translateX({{tX}}px)"></div>
        <div style="position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
          <button class="opt {{tc.off}}" onClick="{{tPick.off}}" aria-pressed="{{tp.off}}" style="height: 44px; border-radius: 22px; font-size: 13px; font-weight: 600">Off</button>
          <button class="opt {{tc.m30}}" onClick="{{tPick.m30}}" aria-pressed="{{tp.m30}}" aria-label="30 minutes" style="height: 44px; border-radius: 22px; font-size: 13px; font-weight: 600">30m</button>
          <button class="opt {{tc.h1}}" onClick="{{tPick.h1}}" aria-pressed="{{tp.h1}}" aria-label="1 hour" style="height: 44px; border-radius: 22px; font-size: 13px; font-weight: 600">1h</button>
          <button class="opt {{tc.h2}}" onClick="{{tPick.h2}}" aria-pressed="{{tp.h2}}" aria-label="2 hours" style="height: 44px; border-radius: 22px; font-size: 13px; font-weight: 600">2h</button>
          <button class="opt {{tc.h4}}" onClick="{{tPick.h4}}" aria-pressed="{{tp.h4}}" aria-label="4 hours" style="height: 44px; border-radius: 22px; font-size: 13px; font-weight: 600">4h</button>
        </div>
      </div>
    </section>

    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 12px">
      <sc-for list="{{schedules}}" as="x" hint-placeholder-count="3">
        <div class="glass sched {{x.cls}}" style="border-radius: 28px; padding: 16px">
          <div style="display: flex; align-items: center; justify-content: space-between; height: 40px">
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 16px; font-weight: 600">{{x.name}}</span>
              <span style="font-size: 13px; color: var(--muted)">{{x.action}}</span>
            </div>
            <button class="tg {{x.tgCls}}" role="switch" aria-checked="{{x.on}}" aria-label="{{x.aria}}" onClick="{{x.toggle}}" style="position: relative; width: 48px; height: 28px; border-radius: 14px; flex: none"><span class="k" style="position: absolute; top: 3px; width: 22px; height: 22px; border-radius: 11px"></span></button>
          </div>
          <div style="display: flex; align-items: center; gap: 12px; margin-top: 12px">
            <div style="width: 84px; height: 52px; box-sizing: border-box; border-radius: 18px; background: var(--pill); display: flex; flex-direction: column; justify-content: center; padding: 0 14px">
              <span style="font-size: 11px; color: var(--muted)">Time</span>
              <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em">{{x.time}}</span>
            </div>
            <span class="sr">{{x.daysLabel}}</span>
            <div aria-hidden="true" style="display: flex; gap: 4px">
              <sc-for list="{{x.days}}" as="d" hint-placeholder-count="7">
                <span class="day {{d.cls}}" style="width: 26px; height: 26px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">{{d.l}}</span>
              </sc-for>
            </div>
          </div>
        </div>
      </sc-for>
    </div>

    <nav class="glass" aria-label="Main" style="margin-top: auto; align-self: center; display: flex; gap: 6px; padding: 6px; border-radius: 34px">
      <a href="Main.dc.html" class="nav press" aria-label="Home" style="width: 56px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg></a>
      <a href="Rooms.dc.html" class="nav press" aria-label="All devices" style="width: 56px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect></svg></a>
      <a href="Schedules.dc.html" class="nav cur press" aria-label="Schedules" aria-current="page" style="width: 56px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></a>
      <button class="nav press" aria-label="Settings" style="width: 56px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const timer = s.timer ?? 'off';
    const enabled = s.enabled ?? { wind: true, morning: true, precool: false };
    const keys = ['off', 'm30', 'h1', 'h2', 'h4'];
    const notes = { off: 'Not set', m30: 'Turns off in 30 min', h1: 'Turns off in 1 hour', h2: 'Turns off in 2 hours', h4: 'Turns off in 4 hours' };
    const tc = {}, tp = {}, tPick = {};
    keys.forEach((k) => { tc[k] = k === timer ? 'sel' : ''; tp[k] = k === timer; tPick[k] = () => this.setState({ timer: k }); });
    const letters = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    const base = [
      { id: 'wind', time: '22:30', name: 'Wind down', action: 'Cool 25° · Fan quiet', days: [1, 1, 1, 1, 1, 0, 0], daysLabel: 'Monday to Friday' },
      { id: 'morning', time: '07:00', name: 'Morning off', action: 'Turn off', days: [1, 1, 1, 1, 1, 1, 1], daysLabel: 'Every day' },
      { id: 'precool', time: '18:30', name: 'Pre-cool', action: 'Cool 24° · Fan auto', days: [1, 1, 1, 1, 1, 0, 0], daysLabel: 'Monday to Friday' }
    ];
    return {
      theme: this.props.theme ?? 'dark',
      timerNote: notes[timer],
      moonCls: timer === 'off' ? '' : 'set',
      tc: tc, tp: tp, tPick: tPick,
      tX: (keys.indexOf(timer) * 62.8).toFixed(1),
      schedules: base.map((b) => {
        const on = !!enabled[b.id];
        return {
          name: b.name,
          action: b.action,
          time: b.time,
          daysLabel: b.daysLabel,
          days: b.days.map((d, i) => ({ l: letters[i], cls: d ? 'd-on' : '' })),
          on: on,
          cls: on ? '' : 'off',
          tgCls: on ? 'on' : '',
          aria: b.name + ' at ' + b.time,
          toggle: () => this.setState({ enabled: Object.assign({}, enabled, { [b.id]: !on }) })
        };
      })
    };
  }
}
</script>
</body>
</html>
