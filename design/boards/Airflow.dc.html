<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const v = s.v ?? 'p3';
    const h = s.h ?? 'auto';
    const keys = ['auto', 'p1', 'p2', 'p3', 'p4', 'p5'];
    const vAngles = { p1: 6, p2: 14, p3: 22, p4: 30, p5: 40 };
    const hAngles = { p1: 50, p2: 25, p3: 0, p4: -25, p5: -50 };
    const build = (cur, field) => {
      const cls = {}, pressed = {}, pick = {}, dots = {};
      keys.forEach((k) => {
        cls[k] = k === cur ? 'sel' : '';
        pressed[k] = k === cur;
        pick[k] = () => this.setState({ [field]: k });
        if (k !== 'auto') dots[k] = cur === 'auto' ? 'auto' : (k === cur ? 'on' : '');
      });
      return { cls: cls, pressed: pressed, pick: pick, dots: dots, x: (keys.indexOf(cur) * 53.7).toFixed(1) };
    };
    const V = build(v, 'v');
    const H = build(h, 'h');
    const hNames = { p1: 'Far left', p2: 'Left', p3: 'Centre', p4: 'Right', p5: 'Far right' };
    return {
      theme: this.props.theme ?? 'dark',
      vc: V.cls, vp: V.pressed, vPick: V.pick, vd: V.dots, vX: V.x,
      hc: H.cls, hp: H.pressed, hPick: H.pick, hd: H.dots, hX: H.x,
      vSweep: v === 'auto' ? 'sweep' : '',
      hSweep: h === 'auto' ? 'sweep' : '',
      vDeg: v === 'auto' ? 22 : vAngles[v],
      hDeg: h === 'auto' ? 0 : hAngles[h],
      vLabel: v === 'auto' ? 'Swinging' : 'Position ' + v.slice(1),
      hLabel: h === 'auto' ? 'Swinging' : hNames[h]
    };
  }
}
</script>
