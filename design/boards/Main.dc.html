<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:disabled{cursor:default}
.th-light{--bg:#E7E5E2;--ink:#141210;--muted:#5E5A56;--track:rgba(20,18,16,.07);--glass:rgba(255,255,255,.58);--glass-line:rgba(255,255,255,.85);--glass-shadow:0 10px 30px rgba(60,40,20,.07);--pill:#FFFFFF;--sel-bg:#141210;--sel-ink:#FFFFFF;--accent:#E8701F;--unit:#F7F6F4;--slot:#1C1A18;--particle:rgba(20,18,16,.45);color-scheme:light}
.th-dark{--bg:#151413;--ink:#F3F1EE;--muted:#A39E98;--track:rgba(255,255,255,.08);--glass:rgba(48,46,44,.55);--glass-line:rgba(255,255,255,.08);--glass-shadow:0 10px 30px rgba(0,0,0,.3);--pill:rgba(255,255,255,.10);--sel-bg:#F3F1EE;--sel-ink:#151413;--accent:#F07A2A;--unit:#F2F1EF;--slot:#1C1A18;--particle:rgba(255,255,255,.5);color-scheme:dark}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow)}
.th-light{--wave:rgba(20,18,16,.09)}
.th-dark{--wave:rgba(255,255,255,.07)}
.breeze{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.breeze svg{position:absolute;left:0;top:0}
.breeze path{fill:none;stroke:var(--wave);stroke-width:1}
.bz1{animation:breeze 70s linear infinite}
.bz2{animation:breeze 110s linear infinite}
@keyframes breeze{to{transform:translateX(-390px)}}
@media (prefers-reduced-motion:reduce){.bz1,.bz2{animation:none}}
.press{transition:transform .15s,opacity .2s}
.press:active{transform:scale(.94)}
.rp{background:var(--glass);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid var(--glass-line);color:var(--ink);transition:background .3s,color .3s,transform .15s}
.rp:active{transform:scale(.95)}
.rp.sel{background:var(--sel-bg);color:var(--sel-ink);border-color:transparent}
.flow{transition:opacity .6s}
.is-off .flow{opacity:0}
.pt{position:absolute;left:0;top:0;width:4px;height:4px;border-radius:50%;background:var(--particle);offset-rotate:0deg;opacity:0;animation:along 2.4s linear infinite}
@keyframes along{0%{offset-distance:0%;opacity:0}12%{opacity:1}75%{opacity:1}100%{offset-distance:100%;opacity:0}}
.slot{height:5px;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.is-off .slot{height:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 2s linear infinite}
.is-off .spin{animation:none}
.pp .knob{left:4px;background:var(--track);color:var(--ink);transition:left .45s cubic-bezier(.3,1.3,.5,1),background .3s,color .3s}
.pp.on .knob{left:calc(100% - 48px);background:var(--accent);color:#FFFFFF;box-shadow:0 6px 16px rgba(232,112,31,.35)}
.pp .lbl-on{opacity:0;transition:opacity .3s}
.pp.on .lbl-on{opacity:1}
.pp .lbl-off{transition:opacity .3s}
.pp.on .lbl-off{opacity:0}
.pp:disabled{opacity:.4}
.pw{background:var(--pill);color:var(--ink);transition:background .3s,color .3s,box-shadow .3s,transform .15s}
.pw:active{transform:scale(.92)}
.pw.on{background:var(--accent);color:#FFFFFF;box-shadow:0 6px 16px rgba(232,112,31,.35)}
.pw:disabled{opacity:.4}
.card{transition:opacity .3s}
.card.offline{opacity:.55}
.disp .dv,.disp svg,.disp .dbars{transition:opacity .4s}
.is-off .disp .dv,.is-off .disp svg,.is-off .disp .dbars{opacity:0}
.disp .dv{text-shadow:0 0 8px rgba(232,112,31,.3);font-variant-numeric:tabular-nums}
.mi,.pi{display:none}
.mi.show,.pi.show{display:block}
.disp.pa{animation:dpa .6s ease-out}
.disp.pb{animation:dpb .6s ease-out}
@keyframes dpa{0%{opacity:.15}100%{opacity:1}}
@keyframes dpb{0%{opacity:.15}100%{opacity:1}}
.bar{background:rgba(232,112,31,.2);transition:background .3s,box-shadow .3s}
.bar.lit{background:#E8701F}
.dbars.auto .bar{animation:barwave 1.4s ease-in-out infinite}
.dbars.auto .bar:nth-child(2){animation-delay:.15s}
.dbars.auto .bar:nth-child(3){animation-delay:.3s}
.dbars.auto .bar:nth-child(4){animation-delay:.45s}
@keyframes barwave{0%,100%{background:rgba(232,112,31,.2)}50%{background:#E8701F}}
.nav{color:var(--muted)}
.nav.cur{background:var(--sel-bg);color:var(--sel-ink)}
@media (prefers-reduced-motion:reduce){.pt,.spin{animation:none}}
</style>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const featured = s.featured ?? 'bed';
    const power = s.power ?? { bed: true, living: false, study: false };
    const data = [
      { id: 'bed', name: 'Bedroom', mode: 'Cool', temp: 24, inside: 27, online: true },
      { id: 'living', name: 'Living room', mode: 'Dry', temp: 25, inside: 29, online: true },
      { id: 'study', name: 'Study', mode: 'Cool', temp: 24, inside: 31, online: false }
    ];
    const isOn = (r) => r.online && !!power[r.id];
    const stateOf = (r) => !r.online ? 'Offline' : (isOn(r) ? (r.mode === 'Cool' ? 'Cooling' : 'Drying') : 'Standby');
    const toggle = (r) => () => this.setState({ power: Object.assign({}, power, { [r.id]: !power[r.id] }), flip: !s.flip });
    const pick = (r) => () => this.setState({ featured: r.id, flip: !s.flip });

    const fr = data.find((r) => r.id === featured) || data[0];
    const fOn = isOn(fr);
    const f = {
      name: fr.name,
      sub: 'Air conditioner · ' + stateOf(fr),
      temp: fr.temp,
      inside: fr.inside,
      mode: fr.mode,
      mi: { cool: fr.mode === 'Cool' ? 'show' : '', dry: fr.mode === 'Dry' ? 'show' : '' },
      pulse: s.flip ? 'pa' : 'pb',
      on: fOn,
      offCls: fOn ? '' : 'is-off',
      ppCls: fOn ? 'on' : '',
      disabled: !fr.online,
      toggle: toggle(fr)
    };

    return {
      theme: this.props.theme ?? 'dark',
      rooms: data.map((r) => ({ name: r.name, cls: r.id === featured ? 'sel' : '', sel: r.id === featured, pick: pick(r) })),
      f: f,
      others: data.filter((r) => r.id !== featured).map((r) => ({
        name: r.name,
        sub: r.online ? stateOf(r) + ' · ' + r.temp + '°' : 'Offline',
        on: isOn(r),
        pwCls: isOn(r) ? 'on' : '',
        cardCls: r.online ? '' : 'offline',
        disabled: !r.online,
        aria: r.name + ' power',
        toggle: toggle(r),
        pick: pick(r)
      }))
    };
  }
}
</script>
</body>
</html>
